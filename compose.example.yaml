# Drop-in service block. Put it in your own compose file, or run it on its own with:
#   docker compose -f compose.example.yaml up -d
services:
  lombo-gate:
    image: ghcr.io/lombo-forge/lombo-gate:latest   # or build: .
    container_name: lombo-gate
    restart: unless-stopped
    env_file: .env
    read_only: true
    volumes:
      - lombo-gate-data:/data
    mem_limit: 128m
    # If Seerr and Sonarr are in another compose project, join its network:
    # networks: [media]
# networks:
#   media:
#     external: true
volumes:
  lombo-gate-data:
